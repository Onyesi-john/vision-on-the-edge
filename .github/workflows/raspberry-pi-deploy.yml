name: Build, Push, and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Initialize build log
        run: |
          mkdir -p ci_logs
          echo "ci_timing build log for run $(date)" > ci_logs/ci_timing_build.log

      - name: Log checkout time
        run: |
          echo "$(date +%s),checkout_start" >> ci_logs/ci_timing_build.log
          # checkout happens automatically via the previous step
          echo "$(date +%s),checkout_end" >> ci_logs/ci_timing_build.log

      - name: Build and push ARM64 image
        run: |
          echo "$(date +%s),build_start" >> ci_logs/ci_timing_build.log

          docker buildx create --use
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin docker.io

          docker buildx build \
            --platform linux/arm64 \
            --push \
            -t ${{ secrets.DOCKER_USERNAME }}/edge_deployment:latest \
            -f app/Dockerfile \
            app/

          echo "$(date +%s),build_end" >> ci_logs/ci_timing_build.log

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: ci_timing_build
          path: ci_logs/ci_timing_build.log

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Initialize deploy log
        run: |
          mkdir -p ci_logs
          echo "ci_timing deploy log for run $(date)" > ci_logs/ci_timing_deploy.log
          echo "$(date +%s),deploy_start" >> ci_logs/ci_timing_deploy.log

      - name: Deploy to Raspberry Pi
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.PI_HOST }}
          port: ${{ secrets.PI_PORT }}
          username: ${{ secrets.PI_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          script: |
            echo "$(date +%s),deploy_start" >> ci_logs/ci_timing_deploy.log

            cd /home/hshl/VisionOnEdge

            echo "$(date +%s),docker_pull_start" >> ci_logs/ci_timing_deploy.log
            docker compose pull
            echo "$(date +%s),docker_pull_end" >> ci_logs/ci_timing_deploy.log

            docker compose down || true
            docker compose up -d  app

            echo "$(date +%s),docker_prune_start" >> ci_logs/ci_timing_deploy.log
            docker image prune -af
            echo "$(date +%s),docker_prune_end" >> ci_logs/ci_timing_deploy.log

            echo "$(date +%s),deploy_end" >> ci_logs/ci_timing_deploy.log

      - name: Upload deploy log
        uses: actions/upload-artifact@v4
        with:
          name: ci_timing_deploy
          path: ci_logs/ci_timing_deploy.log
