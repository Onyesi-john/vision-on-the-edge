name: Build and Push to Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Start timing after checkout
      - name: Log checkout complete
        run: echo "$(date +%s),checkout_done" >> ci_timing.log

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log Buildx setup
        run: echo "$(date +%s),buildx_setup_done" >> ci_timing.log

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          registry: docker.io

      - name: Log Docker login
        run: echo "$(date +%s),docker_login_done" >> ci_timing.log

      # Build and push Docker image
      - name: Build and push ARM64 image
        run: |
          echo "$(date +%s),docker_build_start" >> ci_timing.log
          docker buildx build \
            --platform linux/arm64 \
            --push \
            -t ${{ secrets.DOCKER_USERNAME }}/edge_deployment:latest \
            -f app/Dockerfile \
            app/
          echo "$(date +%s),docker_build_end" >> ci_timing.log

      # Upload the timing log as artifact
      - name: Upload timing log
        uses: actions/upload-artifact@v3
        with:
          name: ci_timing
          path: ci_timing.log
