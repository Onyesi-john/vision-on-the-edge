name: Build, Push, and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Initialize timing log
        run: |
          mkdir -p ci_logs
          echo "ci_timing log for run $(date)" > ci_logs/ci_timing.log

      - name: Log checkout
        run: |
          echo "$(date +%s),checkout_start" >> ci_logs/ci_timing.log
          echo "$(date +%s),checkout_end" >> ci_logs/ci_timing.log

      - name: Set up Docker Buildx
        run: |
          echo "$(date +%s),buildx_setup_start" >> ci_logs/ci_timing.log
          docker buildx create --use
          echo "$(date +%s),buildx_setup_end" >> ci_logs/ci_timing.log

      - name: Log in to Docker Hub
        run: |
          echo "$(date +%s),docker_login_start" >> ci_logs/ci_timing.log
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin docker.io
          echo "$(date +%s),docker_login_end" >> ci_logs/ci_timing.log

      - name: Build and push App image
        run: |
          echo "$(date +%s),docker_app_build_start" >> ci_logs/ci_timing.log
          docker buildx build \
            --platform linux/arm64 \
            --push \
            -t ${{ secrets.DOCKER_USERNAME }}/edge_deployment:latest \
            -f app/Dockerfile \
            app/
          echo "$(date +%s),docker_app_push_end" >> ci_logs/ci_timing.log

      - name: Build and push Nginx image
        run: |
          echo "$(date +%s),docker_nginx_build_start" >> ci_logs/ci_timing.log
          docker buildx build \
            --platform linux/arm64 \
            --push \
            -t ${{ secrets.DOCKER_USERNAME }}/visiononedge-nginx:latest \
            -f nginx/Dockerfile \
            nginx/
          echo "$(date +%s),docker_nginx_push_end" >> ci_logs/ci_timing.log

      - name: Upload timing log
        uses: actions/upload-artifact@v4
        with:
          name: ci_timing
          path: ci_logs/ci_timing.log

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Download timing log
        uses: actions/download-artifact@v4
        with:
          name: ci_timing
          path: ci_logs

      - name: Deploy to Raspberry Pi
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.PI_HOST }}
          port: ${{ secrets.PI_PORT }}
          username: ${{ secrets.PI_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          script: |
            echo "$(date +%s),deploy_start" >> ci_logs/ci_timing.log

            cd /home/hshl/VisionOnEdge

            # Pull the latest images
            echo "$(date +%s),docker_pull_start" >> ci_logs/ci_timing.log
            docker compose pull
            echo "$(date +%s),docker_pull_end" >> ci_logs/ci_timing.log

            # Ensure previous containers are fully stopped
            docker compose down

            # Blue/Green app switch logic
            if docker ps --format '{{.Names}}' | grep -q app_blue; then
              echo "Blue was running → start Green"
              docker compose up -d app_green nginx
            elif docker ps --format '{{.Names}}' | grep -q app_green; then
              echo "Green was running → start Blue"
              docker compose up -d app_blue nginx
            else
              echo "No app running → start Green by default"
              docker compose up -d app_green nginx
            fi

            # Cleanup unused images
            echo "$(date +%s),docker_prune_start" >> ci_logs/ci_timing.log
            docker image prune -af
            echo "$(date +%s),docker_prune_end" >> ci_logs/ci_timing.log

            echo "$(date +%s),deploy_end" >> ci_logs/ci_timing.log

      - name: Upload updated timing log
        uses: actions/upload-artifact@v4
        with:
          name: ci_timing
          path: ci_logs/ci_timing.log
