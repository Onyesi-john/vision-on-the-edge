name: Build, Push, and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Initialize timing log
        run: |
          mkdir -p ci_logs
          echo "ci_timing log for run $(date)" > ci_logs/ci_timing.log

      - name: Log checkout time
        run: |
          echo "$(date +%s),checkout_start" >> ci_logs/ci_timing.log
          # checkout happens automatically via the previous step
          echo "$(date +%s),checkout_end" >> ci_logs/ci_timing.log

      - name: Build and push ARM64 image
        run: |
          echo "$(date +%s),build_push_start" >> ci_logs/ci_timing.log

          docker buildx create --use
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin docker.io

          docker buildx build \
            --platform linux/arm64 \
            --push \
            -t ${{ secrets.DOCKER_USERNAME }}/edge_deployment:latest \
            -f app/Dockerfile \
            app/

          echo "$(date +%s),build_push_end" >> ci_logs/ci_timing.log

      - name: Upload timing log
        uses: actions/upload-artifact@v4
        with:
          name: ci_timing_build
          path: ci_logs/ci_timing.log

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Download timing log
        uses: actions/download-artifact@v4
        with:
          name: ci_timing_build
          path: ci_logs

      - name: Deploy to Raspberry Pi
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.PI_HOST }}
          port: ${{ secrets.PI_PORT }}
          username: ${{ secrets.PI_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          script: |
            echo "$(date +%s),deploy_start" >> ci_logs/ci_timing.log

            cd /home/hshl/VisionOnEdge

            docker compose pull
            docker compose down || true
            docker compose up -d --build app
            docker image prune -af

            echo "$(date +%s),deploy_end" >> ci_logs/ci_timing.log

      - name: Upload updated timing log
        uses: actions/upload-artifact@v4
        with:
          name: ci_timing_deploy
          path: ci_logs/ci_timing.log
