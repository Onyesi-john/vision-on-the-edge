on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        run: |
          mkdir -p ci_logs
          echo "ci_timing log for run $(date)" > ci_logs/ci_timing.log
          echo "$(date +%s),checkout_start" >> ci_logs/ci_timing.log
          git checkout main  # or your actual checkout command
          echo "$(date +%s),checkout_end" >> ci_logs/ci_timing.log

      - name: Build and push Docker image
        run: |
          echo "$(date +%s),docker_build_start" >> ci_logs/ci_timing.log
          docker buildx build \
            --platform linux/arm64 \
            --push \
            -t ${{ secrets.DOCKER_USERNAME }}/edge_deployment:latest \
            -f app/Dockerfile \
            app/
          echo "$(date +%s),docker_push_end" >> ci_logs/ci_timing.log

      - name: Upload build timing log
        uses: actions/upload-artifact@v4
        with:
          name: ci_timing_build
          path: ci_logs/ci_timing.log

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Download build timing log
        uses: actions/download-artifact@v4
        with:
          name: ci_timing_build
          path: ci_logs

      - name: Deploy to Raspberry Pi
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.PI_HOST }}
          port: ${{ secrets.PI_PORT }}
          username: ${{ secrets.PI_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          script: |
            echo "$(date +%s),deploy_start" >> ci_logs/ci_timing.log

            cd /home/hshl/VisionOnEdge

            docker compose pull
            docker compose down || true
            docker compose up -d --build app
            docker image prune -af

            echo "$(date +%s),deploy_end" >> ci_logs/ci_timing.log

      - name: Upload deployment timing log
        uses: actions/upload-artifact@v4
        with:
          name: ci_timing_deploy
          path: ci_logs/ci_timing.log
