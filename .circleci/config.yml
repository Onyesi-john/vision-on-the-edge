version: 2.1

executors:
  arm_executor:
    machine: true  # This is Required for Docker buildx + QEMU multi-arch

jobs:
  build_and_push_docker_image:
    executor: arm_executor
    steps:
      - checkout

      - run:
          name: Initialize build log
          command: |
            mkdir -p ci_logs
            echo "circleci_timing build log for run $(date)" > ci_logs/ci_timing_build.log

      - run:
          name: Log checkout time
          command: |
            echo "$(date +%s),checkout_start" >> ci_logs/ci_timing_build.log
            echo "$(date +%s),checkout_end" >> ci_logs/ci_timing_build.log

      - run:
          name: Build and push ARM64 image
          command: |
            echo "$(date +%s),build_start" >> ci_logs/ci_timing_build.log

            sudo systemctl start docker
            sleep 5
            docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
            docker buildx create --use

            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin docker.io

            docker buildx build \
              --platform linux/arm64 \
              --push \
              -t $DOCKERHUB_USERNAME/edge_deployment:latest \
              -f app/Dockerfile \
              app/

            echo "$(date +%s),build_end" >> ci_logs/ci_timing_build.log

      - store_artifacts:
          path: ci_logs/ci_timing_build.log
          destination: ci_timing_build.log

      - persist_to_workspace:
          root: .
          paths:
            - ci_logs/ci_timing_build.log

  deploy_to_raspberry_pi:
    executor: arm_executor
    steps:
      - attach_workspace:
          at: .

      - run:
          name: Setup SSH Key from Base64 Environment Variable
          command: |
            mkdir -p ~/.ssh
            echo "$PI_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -p $PI_PORT $PI_HOST >> ~/.ssh/known_hosts

            # Optional sanity check
            echo "SSH key header:"
            head -1 ~/.ssh/id_rsa
            echo "File type:"
            file ~/.ssh/id_rsa

      - run:
          name: Initialize deploy log
          command: |
            mkdir -p ci_logs
            echo "circleci_timing deploy log for run $(date)" > ci_logs/ci_timing_deploy.log
            echo "$(date +%s),deploy_start" >> ci_logs/ci_timing_deploy.log

      - run:
          name: Deploy to Raspberry Pi (Pull and Run)
          command: |
            ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -p $PI_PORT $PI_USER@$PI_HOST "
              set -e
              cd /home/hshl/VisionOnEdge

              # Log start in remote folder
              echo \$(date +%s),deploy_start >> ci_logs/ci_timing_deploy.log

              echo \$(date +%s),docker_pull_start >> ci_logs/ci_timing_deploy.log
              docker compose pull
              echo \$(date +%s),docker_pull_end >> ci_logs/ci_timing_deploy.log

              docker compose down || true
              docker compose up -d app

              echo \$(date +%s),docker_prune_start >> ci_logs/ci_timing_deploy.log
              docker image prune -af
              echo \$(date +%s),docker_prune_end >> ci_logs/ci_timing_deploy.log

              echo \$(date +%s),deploy_end >> ci_logs/ci_timing_deploy.log
            "

      - store_artifacts:
          path: ci_logs/ci_timing_deploy.log
          destination: ci_timing_deploy.log

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - build_and_push_docker_image
      - deploy_to_raspberry_pi:
          requires:
            - build_and_push_docker_image
